name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Validate quiz sites and catalog
        run: |
          python scripts/validate_cap_sites.py
          python scripts/validate_science_book3_113_115.py
          python scripts/validate_catalog.py --no-network
      - name: Stage public static site only
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.hermes/' \
            --exclude '_site/' \
            --exclude 'docs/' \
            --exclude 'scripts/' \
            --exclude 'cap-sources.json' \
            --exclude '.gitignore' \
            --exclude '*.md' \
            ./ _site/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
